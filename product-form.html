<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Добавление товара</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        label { display: block; margin-top: 12px; }
        input, textarea { width: 300px; padding: 6px; }
        button { margin-top: 15px; padding: 8px 14px; }
    </style>
</head>
<body>
    <h1>Добавление товара</h1>
    <form th:action="@{/products/add}" th:object="${product}" method="post">
        <label>Название
            <input type="text" th:field="*{name}" required>
        </label>
        <label>Цена
            <input type="number" step="0.01" th:field="*{price}" required>
        </label>
        <label>Описание
            <textarea th:field="*{description}" rows="3"></textarea>
        </label>
        <button type="submit">Сохранить</button>
        <a th:href="@{/products}">Назад к списку</a>
    </form>
</body>
</html>
